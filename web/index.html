<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">

  <!-- SEO -->
  <meta name="description" content="EDUPOL - La mejor app de preparación para el examen de ingreso a la EO PNP y Técnica PNP. Preguntas reales, simulacros y seguimiento de progreso.">
  <meta name="keywords" content="PNP, escuela PNP, examen PNP, preparación policial, ingreso PNP, EO PNP, Técnica PNP, EDUPOL">
  <meta name="author" content="EDUPOL">
  <meta name="robots" content="index, follow">

  <!-- Preload fonts for faster icon and text rendering -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined|Material+Icons+Round" rel="stylesheet">

  <!-- Open Graph / redes sociales -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="EDUPOL - Prepárate para la PNP">
  <meta property="og:description" content="Acceso permanente por S/15. Preguntas reales, simulacros oficiales y soporte VIP por WhatsApp.">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- PWA / iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EDUPOL">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=3"/>
  <link rel="manifest" href="manifest.json?v=3">

  <title>EDUPOL - Prepárate para la PNP</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #060B18;
      overflow: hidden;
    }

    /* Loading indicator shown while CanvasKit/Flutter boots */
    #flutter-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #060B18;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }

    #flutter-loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .fl-logo-text {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 48px;
      font-weight: 900;
      letter-spacing: 8px;
      background: linear-gradient(135deg, #60A5FA, #A78BFA);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 32px;
    }

    .fl-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(96, 165, 250, 0.15);
      border-top-color: #60A5FA;
      border-radius: 50%;
      animation: fl-spin 0.8s linear infinite;
    }

    @keyframes fl-spin {
      to { transform: rotate(360deg); }
    }

    .fl-label {
      margin-top: 16px;
      font-family: 'Outfit', -apple-system, sans-serif;
      font-size: 13px;
      color: rgba(148, 163, 184, 0.7);
      letter-spacing: 1.5px;
    }

    /* Hide scrollbars */
    *::-webkit-scrollbar { display: none; width: 0; height: 0; }
    * { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>

  <!-- Native HTML loading screen (visible while Flutter/CanvasKit downloads) -->
  <div id="flutter-loading">
    <div class="fl-logo-text">EDUPOL</div>
    <div class="fl-spinner"></div>
    <div class="fl-label">CARGANDO...</div>
  </div>

  <script>
    // Hide the native loading screen once Flutter takes over
    window._flutterAppRunner = {
      onEntrypointLoaded: function(engineInitializer) {
        engineInitializer.initializeEngine().then(function(appRunner) {
          // Give Flutter a moment to paint before hiding our loader
          appRunner.runApp();
          setTimeout(function() {
            var loader = document.getElementById('flutter-loading');
            if (loader) loader.classList.add('hidden');
          }, 600);
        });
      }
    };
  </script>

  <!-- Flutter bootstrap — must come after the onEntrypointLoaded hook is defined -->
  <script src="flutter_bootstrap.js?v=8" async></script>

  <!-- Puter.js SDK — loaded AFTER Flutter, non-blocking (defer + onerror safe) -->
  <script>
    (function() {
      var s = document.createElement('script');
      s.src = 'https://js.puter.com/v2/';
      s.defer = true;
      s.onerror = function() {
        console.warn('[EDUPOL] puter.js failed to load — AI features may be limited.');
      };
      document.body.appendChild(s);
    })();
  </script>

</body>
</html>
